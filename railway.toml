# Railway monorepo notes:
# - Deploy API with: dockerfilePath = apps/api/Dockerfile
# - Deploy Web with: dockerfilePath = apps/web/Dockerfile
# - Set NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL on the web service before building.
# - Set DATABASE_URL=${{Postgres.DATABASE_URL}} on the api service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
